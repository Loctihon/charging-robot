# ==========================================================
# LOCAL COSTMAP
# ==========================================================

local_costmap:
  local_costmap:
    ros__parameters:

      use_sim_time: True

      global_frame: odom
      robot_base_frame: base_footprint

      update_frequency: 10.0
      publish_frequency: 5.0

      rolling_window: true

      width: 6        # vùng local map 6m
      height: 6
      resolution: 0.05

      footprint: "[[0.9,0.425],[0.9,-0.425],[-0.9,-0.425],[-0.9,0.425]]"

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_range: 5.0
          raytrace_range: 6.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.7 # Vùng an toàn để né
        cost_scaling_factor: 3.0


# ==========================================================
# GLOBAL COSTMAP
# ==========================================================

global_costmap:
  global_costmap:
    ros__parameters:

      use_sim_time: True

      global_frame: map
