# # ==========================================================
# # MAP SERVER
# # ==========================================================

# map_server:
#   ros__parameters:

#     use_sim_time: True

#     yaml_filename: "/home/loc/new_design_ws/src/thietkemoi/thanxe_new_description/maps/my_vinfast_map.yaml"
amcl:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_footprint"   # frame robot
    global_frame_id: "map"            # frame bản đồ
    odom_frame_id: "odom"             # frame odometry
    scan_topic: "/scan"               # topic lidar

    min_particles: 500
    max_particles: 2000

    laser_max_range: 40.0
    laser_min_range: 0.05

    robot_model_type: "nav2_amcl::OmniMotionModel" # robot_model_type: "nav2_amcl::DifferentialMotionModel" # <--- KHAI BÁO SAI HỆ TRUYỀN ĐỘNG!

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    transform_tolerance: 2.0


# ==========================================================
# CONTROLLER
# ==========================================================

controller_server:
  ros__parameters:

    use_sim_time: True

    controller_frequency: 10.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3

    controller_plugins: ["FollowPath"]

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]

    # -------------------------
    # GOAL CHECKER
    # -------------------------

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1    # sai số vị trí goal
      yaw_goal_tolerance: 0.05    # sai số góc
      stateful: True

    # -------------------------
    # PROGRESS CHECKER
    # -------------------------

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3   # robot phải tiến ít nhất 0.3m
      movement_time_allowance: 10.0   # trong 10s

    # ======================================================
    # DWB LOCAL PLANNER
    # ======================================================

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      # ---------- velocity ----------

      min_vel_x: -0.5
      max_vel_x: 0.5

      min_vel_y: -0.5 # 0.0 
      max_vel_y: 0.5

      max_vel_theta: 1.2

      min_speed_xy: 0.0
      max_speed_xy: 0.5

      min_speed_theta: 0.15

      acc_lim_x: 1.5
      acc_lim_y: 1.5
      acc_lim_theta: 2.0

      decel_lim_x: -1.5
      decel_lim_y: -1.5
      decel_lim_theta: -2.0

      # ---------- sampling ----------

      vx_samples: 20
      vy_samples: 30 #1
      vtheta_samples: 20

      sim_time: 2.0

      # ---------- stopping ----------

      trans_stopped_velocity: 0.1

      # ---------- critics ----------

      critics: [
        "RotateToGoal",
        "ObstacleFootprint",
        "GoalAlign",
        "PathAlign",
        "PathDist",
        "GoalDist",
        "Oscillation",      # <--- VŨ KHÍ 1: CHỐNG GIẬT CỤC
        "Twirling"       # <--- VŨ KHÍ 2: CHỐNG MÚA QUẠT
      ]

      PathAlign.scale: 10.0 #32.0
      GoalAlign.scale: 0.0 #24.0

      PathDist.scale: 40.0
      GoalDist.scale: 40.0 #24.0

      ObstacleFootprint.scale: 20.0

      RotateToGoal.scale: 40.0 #32.0

      Oscillation.scale: 20.0   # Phạt nặng tội vừa bẻ lái qua trái xong lại bẻ ngay qua phải
      Twirling.scale: 15.0      # Phạt tội tự nhiên xoay thân (vtheta) khi không cần thiết

# ==========================================================
# LOCAL COSTMAP
# ==========================================================

local_costmap:
  local_costmap:
    ros__parameters:

      use_sim_time: True

      global_frame: odom
      robot_base_frame: base_footprint

      update_frequency: 10.0
      publish_frequency: 5.0

      rolling_window: true

      width: 6        # vùng local map 6m
      height: 6
      resolution: 0.05

      footprint: "[[0.9,0.425],[0.9,-0.425],[-0.9,-0.425],[-0.9,0.425]]"

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_range: 5.0
          raytrace_range: 6.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.9 # Vùng an toàn để né
        cost_scaling_factor: 2.0


# ==========================================================
# GLOBAL COSTMAP
# ==========================================================

global_costmap:
  global_costmap:
    ros__parameters:

      use_sim_time: True

      global_frame: map
      robot_base_frame: base_footprint

      update_frequency: 5.0
      publish_frequency: 2.0

      footprint: "[[0.9,0.425],[0.9,-0.425],[-0.9,-0.425],[-0.9,0.425]]"

      resolution: 0.05

      plugins: ["static_layer","obstacle_layer","inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.9
        cost_scaling_factor: 2.0


# ==========================================================
# PLANNER
# ==========================================================

# planner_server:
#   ros__parameters:

#     use_sim_time: True

#     planner_plugins: ["GridBased"]

#     GridBased:
#       plugin: "nav2_navfn_planner/NavfnPlanner"
#       tolerance: 0.5
#       use_astar: true
#       allow_unknown: true

planner_server: 
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8 # Ngó 8 hướng để tận dụng tối đa thuật toán 
      w_heuristic: 1.0     # Trọng số (Để 1.0 là cân bằng giữa tốc độ tính toán và đường ngắn nhất)
      use_final_approach_orientation: true # Ép xe xoay đúng góc khi tới đích
# ==========================================================
# BEHAVIOR
# ==========================================================

behavior_server:
  ros__parameters:

    use_sim_time: True

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

    wait:
      plugin: "nav2_behaviors/Wait"


# ==========================================================
# MAP SERVER
# ==========================================================

map_server:
  ros__parameters:

    use_sim_time: True

    yaml_filename: "/home/loc/new_design_ws/src/thietkemoi/thanxe_new_description/maps/my_vinfast_map.yaml"